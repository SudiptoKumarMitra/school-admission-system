server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Runtime configuration and the entry page must never be cached, so a changed API URL or a new
  # release is picked up immediately.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Built assets have content hashes in their names and can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other address (for example /me or /holds/h_1) serves the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
